# CI for branches, on every pull request.
name: CI

on:
  pull_request:

# A newer push to the same PR cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # nix flake check (equivalent of `just check`)
  # runs all tests and checks in the nix sandbox
  check:
    strategy:
      # A failure on one platform doesn't cancel the other.
      fail-fast: false
      matrix:
        runner: [nixos, macos]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: nix flake check -L

  # Can't run nix on windows so we have a separate test script for that
  # on shire, where `ssh windows-ci` reaches a Windows VM runner.
  windows:
    runs-on: shire
    steps:
      - uses: actions/checkout@v4
      - run: nix develop -c just check-windows
